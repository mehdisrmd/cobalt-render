services:
  - type: web
    name: cobalt-engine
    runtime: docker
    plan: free
    envVars:
      # API key database for the yt-dlp engine: a JSON object keyed by
      # API key, e.g. {"<uuid>": {}}. sync: false = never stored in this
      # repo; set it manually in the Render dashboard.
      - key: API_KEYS_JSON
        sync: false
      # Optional YouTube cookies in cobalt format:
      # {"youtube": ["name=value; name2=value2"]}. The boot script converts
      # this into a Netscape cookies.txt for yt-dlp. Also dashboard-only.
      - key: YT_COOKIES_JSON
        sync: false
      # PORT and RENDER_EXTERNAL_URL are NOT set here: Render injects them
      # at runtime and the server reads them directly.
